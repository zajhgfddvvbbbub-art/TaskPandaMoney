<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panda Money Task</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#171327,#090812);color:#fff;min-height:100vh}
.app{max-width:520px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.level{font-size:12px;opacity:.8}
.balance{text-align:center;margin:24px 0 12px}.balance small{opacity:.7}.coins{font-size:42px;font-weight:900;margin-top:5px}
.progress{height:8px;background:#29243b;border-radius:99px;overflow:hidden;margin:14px 30px}.bar{height:100%;width:35%;background:#ffd34d}
.tap-wrap{text-align:center;margin:18px 0}.tap{width:220px;height:220px;border-radius:50%;border:7px solid #4c3c77;background:radial-gradient(circle at 35% 25%,#fff0a3,#ffba39 28%,#d87520 70%,#713719);font-size:95px;box-shadow:0 15px 40px #0008;cursor:pointer;user-select:none;transition:.08s}.tap:active{transform:scale(.94)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#19162a;border:1px solid #302a48;border-radius:14px;padding:11px;text-align:center}.stat b{display:block;margin-top:4px}
.section{margin-top:18px}.section h3{margin:0 0 10px}.card{display:flex;align-items:center;justify-content:space-between;background:#19162a;border:1px solid #302a48;border-radius:14px;padding:13px;margin:8px 0}.card button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:#ffd34d;color:#17120a}.reward{color:#79f7a0;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#11101b;border-top:1px solid #302a48;display:flex;justify-content:center;gap:8px;padding:10px}.nav button{background:#211d32;color:#fff;border:0;border-radius:12px;padding:10px 14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 14px;border-radius:20px;font-weight:800;display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">🐼 Panda Money</div><div class="level">Level <span id="level">1</span></div></div>
  <div class="balance"><small>Your balance</small><div class="coins">🪙 <span id="coins">0</span></div></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="tap-wrap"><button class="tap" id="tap">🐼</button><div style="margin-top:8px;opacity:.7">Tap to earn coins</div></div>
  <div class="stats">
    <div class="stat">⚡ Energy<b><span id="energy">500</span>/500</b></div>
    <div class="stat">📈 Per tap<b>+<span id="perTap">1</span></b></div>
    <div class="stat">💰 Hour<b><span id="hour">0</span></b></div>
  </div>

  <div class="section">
    <h3>🎯 Tasks</h3>
    <div class="card"><span>Refer & Earn<br><small>Invite friends</small></span><span class="reward">+220</span></div>
    <div class="card"><span>📺 Watch daily video</span><span class="reward">+12</span></div>
    <div class="card"><span>▶️ Subscribe to channel</span><span class="reward">+120</span></div>
  </div>

  <div class="section">
    <h3>🚀 Upgrades</h3>
    <div class="card"><span>Tap Power<br><small>Increase coins per tap</small></span><button onclick="upgrade()">Upgrade <span id="cost">100</span></button></div>
  </div>
</div>
<div class="toast" id="toast">+1 coin</div>
<div class="nav"><button>🏠 Home</button><button onclick="showToast('Tasks opened')">🎯 Tasks</button><button onclick="showToast('Rewards opened')">🎁 Rewards</button><button onclick="showToast('Withdraw page')">💳 Withdraw</button></div>

<script>
let coins=Number(localStorage.getItem('pandaCoins')||0), energy=Number(localStorage.getItem('pandaEnergy')||500);
let perTap=Number(localStorage.getItem('pandaPerTap')||1), cost=Number(localStorage.getItem('pandaCost')||100);
const maxEnergy=500;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('pandaCoins',coins);localStorage.setItem('pandaEnergy',energy);localStorage.setItem('pandaPerTap',perTap);localStorage.setItem('pandaCost',cost)}
function render(){$('coins').textContent=coins.toLocaleString();$('energy').textContent=energy;$('perTap').textContent=perTap;$('cost').textContent=cost;$('hour').textContent=perTap*60;$('bar').style.width=Math.min(100,coins/10000*100)+'%';$('level').textContent=Math.max(1,Math.floor(coins/10000)+1)}
function showToast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',700)}
$('tap').onclick=()=>{if(energy<perTap){showToast('No energy');return}coins+=perTap;energy-=perTap;save();render();showToast('+'+perTap+' coin')}
function upgrade(){if(coins<cost){showToast('Not enough coins');return}coins-=cost;perTap++;cost=Math.ceil(cost*1.7);save();render();showToast('Upgrade complete')}
setInterval(()=>{if(energy<maxEnergy){energy=Math.min(maxEnergy,energy+1);save();render()}},1000);
render();
</script>
</body>
</html>
